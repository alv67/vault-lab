services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vaultlab
      POSTGRES_USER: vaultlab
      POSTGRES_PASSWORD: vaultlab
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vaultlab"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      VAULT_DB_HOST: postgres
      VAULT_DB_PORT: 5432
      VAULT_DB_NAME: vaultlab
      VAULT_DB_USER: vaultlab
      VAULT_DB_PASSWORD: vaultlab
      VAULT_DB_SSLMODE: disable
      VAULT_REDIS_ADDR: redis:6379
      VAULT_JWT_SECRET: change-me-in-production
      VAULT_SERVER_PORT: 8080
      VAULT_LOG_LEVEL: debug
      VAULT_PYTHON_SERVICE_URL: "http://python-service:8000"
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    command: >
      sh -c "sleep 3 && /server migrate && /server"

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    environment:
      VAULT_DB_HOST: postgres
      VAULT_DB_PORT: 5432
      VAULT_DB_NAME: vaultlab
      VAULT_DB_USER: vaultlab
      VAULT_DB_PASSWORD: vaultlab
      VAULT_DB_SSLMODE: disable
      VAULT_REDIS_ADDR: redis:6379
      VAULT_JWT_SECRET: change-me-in-production
      VAULT_YAHOO_FINANCE_ENABLED: "true"
      VAULT_PRICE_FETCH_INTERVAL: 1h
    depends_on:
      - postgres
    restart: unless-stopped

  python-service:
    build:
      context: ./python-service
      dockerfile: Dockerfile
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
