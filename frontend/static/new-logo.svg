<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
<defs>
<!-- Background Gradient -->
<linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#143b27" />
<stop offset="100%" stop-color="#091d12" />
</linearGradient>
<!-- P & Arrow Gradient -->
<linearGradient id="pGrad" x1="0%" y1="100%" x2="100%" y2="0%">
<stop offset="0%" stop-color="#22c55e" />
<stop offset="100%" stop-color="#84cc16" />
</linearGradient>
<!-- Subtle Shadow Filter -->
<filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
<feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35" />
</filter>
</defs>
<!-- App Icon Base / Card -->
<rect x="32" y="32" width="448" height="448" rx="100" ry="100" fill="url(#bgGrad)" filter="url(#shadow)" />
<!-- Geometric P with Upward Arrow -->
<g transform="translate(116, 106)" fill="none" stroke="url(#pGrad)" stroke-linecap="round" stroke-linejoin="round">
<!-- Vertical stem of the P and curve flowing into the arrow -->
<path d="M 54 280 L 54 60 C 54 38 72 20 94 20 L 160 20 C 200 20 230 50 230 90 C 230 130 200 160 160 160 L 54 160" stroke-width="26" />
<!-- Inner cutout / detail line mirroring the flow -->
<path d="M 120 160 L 202 242 C 214 254 232 254 244 242 L 254 232 C 266 220 266 202 254 190 L 180 116" stroke-width="18" opacity="0.3" />
<!-- Upward Growth Arrow extending from the P -->
<path d="M 160 160 L 240 80" stroke-width="26" />
<path d="M 190 80 L 240 80 L 240 130" stroke-width="26" />
</g>
</svg>