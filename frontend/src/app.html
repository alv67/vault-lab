<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vault.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f1f5f9" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#020617" />
    <title>VaultLab</title>
    <script>
      // Pre-paint theme bootstrap (EPIC D). Runs before CSS is applied so the
      // first frame never flashes the wrong background. Keep the storage key,
      // the validation and the default in sync with
      // src/lib/stores/theme.svelte.ts (DEFAULT_MODE is flipped to 'dark' in
      // the final EPIC D commit — change it here as well).
      (function () {
        try {
          var stored = localStorage.getItem('vaultlab-theme');
          var mode =
            stored === 'light' || stored === 'dark' || stored === 'system' ? stored : 'light';
          var dark =
            mode === 'dark' ||
            (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
        } catch {
          // Storage unavailable (e.g. private mode): stay on the default theme.
        }
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover" class="antialiased">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
