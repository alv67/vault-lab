# Stack isolato per i test end-to-end. Non tocca i dati reali:
# - DB separato (vaultlab_test) con volume proprio
# - porte host diverse (5433 / 6380 / 8081)
# - fetch Yahoo disabilitato
#
# Uso: make test-e2e
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vaultlab_test
      POSTGRES_USER: vaultlab
      POSTGRES_PASSWORD: vaultlab
    ports:
      - "5433:5432"
    volumes:
      - pgdata_test:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vaultlab"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8081:8080"
    environment:
      VAULT_DB_HOST: postgres
      VAULT_DB_PORT: 5432
      VAULT_DB_NAME: vaultlab_test
      VAULT_DB_USER: vaultlab
      VAULT_DB_PASSWORD: vaultlab
      VAULT_DB_SSLMODE: disable
      VAULT_REDIS_ADDR: redis:6379
      VAULT_JWT_SECRET: test-secret
      VAULT_SERVER_PORT: 8080
      VAULT_LOG_LEVEL: debug
      VAULT_YAHOO_FINANCE_ENABLED: "false"
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    command: >
      sh -c "sleep 3 && /server migrate && /server"

volumes:
  pgdata_test:
